[workspace]
name = "foraging-returns"
version = "0.1.0"
description = "Code and analyses for: Subsistence effort negatively predicts skill among BaYaka foragers"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "win-64"]

[dependencies]
# Core scientific computing
python = ">=3.11,<3.13"
ipykernel = "*"
nbformat = ">=5.10.4,<6"
nbclient = ">=0.10.2,<0.11"
jupyter_client = "*"
numpy = "*"
pandas = "*"

# Probabilistic programming
pymc = ">=5.0"
pytensor = ">=2.14"
arviz = ">=0.22,<1.0"
nutpie = ">=0.4"
numba = "*"
scikit-learn = ">=1.8.0,<2"
pypdf = ">=6.6.0,<7"
graphviz = ">=14.1.1,<15"
python-graphviz = ">=0.21,<0.22"
pymupdf = ">=1.27.2.2,<2"
tensorflow-probability = ">=0.25.0,<0.26"

[pypi-dependencies]
jax = "*"

# Visualization
matplotlib = ">=3.7"
seaborn = ">=0.12"
plotly = "*"

# Quarto
quarto = "*"
quartodoc = "*"
jupyter-cache = "*"
openpyxl = "*"

# Utilities
pyprojroot = "*"
flox = "==0.10.4"

# Testing
pytest = "*"

[tasks]
test = "pytest tests/ -v"
test-cov = "pytest tests/ --cov=foraging_model --cov=preprocessing --cov-report=html"
test-fast = "pytest tests/ -v -x"

