name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cache pixi env
        id: pixi-cache
        uses: actions/cache@v4
        with:
          path: .pixi
          # Bump the version suffix to invalidate the cache when the lockfile rotates.
          key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-v1

      - name: Install pixi
        if: steps.pixi-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Add pixi to PATH (cache hit)
        if: steps.pixi-cache.outputs.cache-hit == 'true'
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install environment
        run: pixi install

      - name: Run tests
        # tests/test_analytics.py auto-skips when canonical idata.nc /
        # shapley.nc files (under gitignored results/) aren't present.
        run: pixi run pytest tests/ -q
